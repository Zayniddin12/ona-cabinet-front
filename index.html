<!DOCTYPE html>
<!--
Use below html tag for RTL version
<html lang="en" dir="rtl" direction="rtl" style="direction: rtl">
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      rel="icon"
      type="image/svg"
      sizes="32x32"
      href="/assets/favicon.svg"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700|Roboto:300,400,500,600,700|Material+Icons"
      rel="stylesheet"
    />
    <title>Ona Fondi | 2023</title>
  </head>
  <!-- add class="dark-mode" to enable dark mode  -->
  <body
    style="
      --kt-toolbar-height: 55px;
      --kt-toolbar-height-tablet-and-mobile: 55px;
    "
  >
    <!--begin::Theme mode setup on page load-->
    <script>
        document.title = `Ona Fondi | ${new Date().getFullYear()}`
      if (document.documentElement) {
        var defaultThemeMode = "system";

        var name = document.body.getAttribute("data-kt-name");
        var themeMode = localStorage.getItem(
          "kt_" + (name ? name + "_" : "") + "theme_mode_value"
        );

        if (themeMode === null) {
          if (defaultThemeMode === "system") {
            themeMode = "light";
          } else {
            themeMode = defaultThemeMode;
          }
        }
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <!--end::Theme mode setup on page load-->
    <noscript>
      <strong
        >We're sorry but metronic-vue doesn't work properly without JavaScript
        enabled. Please enable it to continue.</strong
      >
    </noscript>
    <div id="app" class="d-flex flex-column flex-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
